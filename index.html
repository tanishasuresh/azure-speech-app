<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Ordering App Prototype</title>
  <script src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@latest/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    .controls { display: flex; gap: 10px; margin-bottom: 20px; }
    button { padding: 10px 20px; cursor: pointer; background: #0078d4; color: white; border: none; border-radius: 4px; }
    button:disabled { background: #cccccc; cursor: not-allowed; }
    #output { width: 100%; height: 200px; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    #status { color: #d9534f; margin-bottom: 10px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Voice Ordering App Prototype</h2>
  
  <div id="status"></div>

  <div class="controls">
    <button id="startBtn">Start Recording</button>
    <button id="stopBtn" disabled>Stop</button>
  </div>

  <textarea id="output" readonly placeholder="Transcribed order text will appear here..."></textarea>

  <script>
    let recognizer;
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const output = document.getElementById('output');
    const status = document.getElementById('status');

    // Automatically fetch temporary authorization token from your backend API
    async function getAuthorizationToken() {
      const response = await fetch('/api/get-speech-token');
      if (!response.ok) throw new Error("Could not fetch speech token from backend.");
      return await response.json();
    }

    startBtn.addEventListener('click', async () => {
      status.textContent = "";

      if (typeof SpeechSDK === 'undefined') {
        status.textContent = "Error: Speech SDK failed to load. Check your internet connection.";
        return;
      }

      try {
        await navigator.mediaDevices.getUserMedia({ audio: true });

        // Retrieve token dynamically without manual input
        const { token, region } = await getAuthorizationToken();
        const speechConfig = SpeechSDK.SpeechConfig.fromAuthorizationToken(token, region);
        speechConfig.speechRecognitionLanguage = "en-US";
        
        const audioConfig = SpeechSDK.AudioConfig.fromDefaultMicrophoneInput();
        recognizer = new SpeechSDK.SpeechRecognizer(speechConfig, audioConfig);

        recognizer.recognizing = (s, e) => {
          output.value = `[Listening...] ${e.result.text}`;
        };

        recognizer.recognized = (s, e) => {
          if (e.result.reason === SpeechSDK.ResultReason.RecognizedSpeech) {
            output.value += `\n${e.result.text}`;
          }
        };

        recognizer.canceled = (s, e) => {
          status.textContent = `Error: ${e.errorDetails}`;
          stopRecording();
        };

        recognizer.startContinuousRecognitionAsync(
          () => {
            startBtn.disabled = true;
            stopBtn.disabled = false;
            output.value = "Listening... Speak your order into the microphone.\n";
          },
          err => {
            status.textContent = `Failed to start recognition: ${err}`;
          }
        );
      } catch (err) {
        status.textContent = `Error: ${err.message}`;
      }
    });

    function stopRecording() {
      if (recognizer) {
        recognizer.stopContinuousRecognitionAsync(() => {
          startBtn.disabled = false;
          stopBtn.disabled = true;
          output.value += "\n[Stopped]";
        });
      }
    }

    stopBtn.addEventListener('click', stopRecording);
  </script>
</body>
</html>
